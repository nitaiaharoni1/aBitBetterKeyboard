only_rules:
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - nesting

file_length:
  warning: 500
  error: 500
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 50

cyclomatic_complexity:
  warning: 10
  error: 10
  ignores_case_statements: false

nesting:
  type_level:
    warning: 1
    error: 1
  function_level:
    warning: 2
    error: 2
  check_nesting_in_closures_and_statements: true
